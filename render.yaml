services:
  - type: web
    name: portfolio-backend
    env: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: SERVER_PORT
        value: 8081
      - key: EMAILJS_SERVICE_ID
        value: service_iutk1nl
      - key: EMAILJS_TEMPLATE_ID
        value: template_c134zpm
      - key: EMAILJS_PUBLIC_KEY
        value: xQAuK45IB8f2X6uG1
      - key: EMAILJS_PRIVATE_KEY
        value: wjbr0AY-3JlcXaF4SnzR2

  - type: static
    name: portfolio-frontend
    rootDir: meu-portifolio
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_URL
        value: https://portifolio-backend-swm7.onrender.com/api
